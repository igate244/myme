# main に push されたら、テスト → ビルド → Firebase Hosting（https://myme-c829c.web.app）に公開
# 旧 MYME と同じ Firebase プロジェクト（myme-c829c）・同じアドレスなので、スマホの中のデータはそのまま使える。
# 鍵は Secrets の FIREBASE_SERVICE_ACCOUNT（myme-c829c のサービスアカウント）
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: myme-c829c
          channelId: live
